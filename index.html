<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접수처 공지</title>
<style>
  :root{
    --bg:#f4f5f6; --surface:#ffffff; --border:#e1e3e5; --border-strong:#c7cbcf;
    --text:#202124; --text-secondary:#5f6368; --text-muted:#9aa0a6;
    --accent:#33414a; --accent-fg:#ffffff;
    --warn-bg:#fff8e1; --warn-border:#e9c93a;
    --danger-bg:#fdecea; --danger-border:#e0776b; --danger-text:#e0201a; --danger-row-bg:#fff6f5;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Noto Sans KR','Malgun Gothic',sans-serif; background:var(--bg); color:var(--text); font-size:14px;}
  button{font-family:inherit; font-size:13px; cursor:pointer; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:6px; padding:6px 12px;}
  button:hover{background:#f0f1f2;}
  button.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent);}
  button.primary:hover{opacity:0.9;}
  button.ghost{border-color:transparent; background:transparent;}
  button.small{padding:4px 8px; font-size:12px;}
  input[type=text], input[type=password], textarea, select{
    font-family:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--border-strong);
    border-radius:6px; background:var(--surface); color:var(--text); width:100%;
  }
  .app{max-width:1180px; margin:0 auto; padding:20px 16px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;}
  .topbar h1{font-size:20px; font-weight:700; margin:0;}
  .topbar .date{font-size:13px; color:var(--text-muted);}
  .subline{font-size:12.5px; color:var(--text-secondary); margin-bottom:16px;}
  .subline b{color:var(--text); font-weight:700;}
  .layout{display:flex; gap:16px; align-items:flex-start;}
  .sidebar{width:200px; flex-shrink:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .sidebar-head{padding:10px 14px; font-size:12px; font-weight:700; color:var(--text-secondary); border-bottom:1px solid var(--border);}
  .carrier-item{display:flex; align-items:center; gap:6px; padding:10px 12px; border-left:3px solid transparent; cursor:pointer; border-bottom:1px solid var(--border);}
  .carrier-item:last-child{border-bottom:none;}
  .carrier-item:hover{background:#fafafa;}
  .carrier-item.active{border-left-color:var(--accent); background:#f4f5f6;}
  .carrier-item .grip{cursor:grab; color:var(--text-muted); font-size:12px; user-select:none;}
  .carrier-item .info{flex:1; min-width:0;}
  .carrier-item .name{font-size:14px; font-weight:500;}
  .carrier-item.active .name{font-weight:700;}
  .carrier-item .time{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .carrier-item .time.unsaved{color:var(--danger-text); font-weight:700;}
  .sidebar-foot{padding:8px; border-top:1px solid var(--border);}
  .main{flex:1; min-width:0;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .toolbar .left, .toolbar .right{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .save-status{font-size:12px; color:var(--text-muted);}
  .save-status.err{color:var(--danger-text); font-weight:700;}
  .save-status.ok{color:#1b7f3b;}
  .save-status.warn{color:#b26a00; font-weight:700;}
  .content-row{display:block;}
  table.notice{width:100%; table-layout:fixed; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  table.notice td{word-wrap:break-word; overflow-wrap:anywhere;}
  table.notice th{background:#eef0f1; color:var(--text); font-size:13px; font-weight:700; text-align:left; padding:9px 10px; border:1px solid var(--border);}
  table.notice td{padding:9px 10px; border:1px solid var(--border); font-size:13.5px; vertical-align:top;}
  table.notice tr.hl-warn td{background:var(--warn-bg);}
  table.notice tr.hl-danger td{background:var(--danger-row-bg); color:var(--danger-text); font-weight:700;}
  table.notice tr[data-idx]:hover td{filter:brightness(0.96);}
  td[contenteditable=true]{outline:none;}
  td[contenteditable=true]:focus, th[contenteditable=true]:focus{background:#eef4ff;}
  .col-actions{width:168px; white-space:nowrap;}
  .row-actions{display:flex; gap:3px; align-items:center; flex-wrap:nowrap;}
  .row-actions button{padding:3px 5px; font-size:12px; line-height:1; min-width:24px;}
  .grip-handle{cursor:grab; color:var(--text-muted); padding:2px 3px; font-size:13px;}
  .note-box{width:100%; box-sizing:border-box; border-radius:var(--radius); padding:16px 20px; border:1px solid var(--border); margin-top:12px;}
  .note-box.warn{background:var(--warn-bg); border-color:var(--warn-border);}
  .note-box.danger{background:var(--danger-bg); border-color:var(--danger-border); color:var(--danger-text);}
  .note-box .note-title{font-size:14px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .note-box .note-body{font-size:13.5px; line-height:1.75;}
  .note-box .note-body p{margin:0 0 12px;}
  .note-box .note-body p:last-child{margin-bottom:0;}
  .legend{display:flex; gap:8px; margin-top:10px;}
  .legend span{font-size:11.5px; padding:3px 8px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text-secondary);}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; z-index:100;}
  .modal{background:var(--surface); border-radius:12px; padding:20px 22px; width:420px; max-width:90vw; max-height:85vh; overflow:auto;}
  .modal.wide{width:620px;}
  .modal h2{font-size:16px; margin:0 0 14px;}
  .modal-row{margin-bottom:12px;}
  .modal-row label{display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:4px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .field-list-row{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
  .field-list-row input{flex:1;}
  .hidden{display:none !important;}
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:4px;}
  .drag-over{outline:2px dashed var(--border-strong); outline-offset:-2px;}

  /* 경고 배너 (저장 실패 / 불러오기 실패 / 동시수정 충돌) */
  #alertBanner{
    position:sticky; top:0; z-index:50;
    background:var(--danger-bg); border:2px solid var(--danger-border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px; box-shadow:0 3px 12px rgba(224,32,26,0.20);
  }
  #alertBanner.soft{background:var(--warn-bg); border-color:var(--warn-border); box-shadow:0 3px 12px rgba(233,201,58,0.25);}
  #alertBanner .ab-title{font-size:15px; font-weight:700; color:var(--danger-text); margin-bottom:6px;}
  #alertBanner.soft .ab-title{color:#8a6100;}
  #alertBanner .ab-body{font-size:13.5px; line-height:1.7; color:var(--text);}
  #alertBanner .ab-body b{color:var(--danger-text);}
  #alertBanner.soft .ab-body b{color:#8a6100;}
  #alertBanner .ab-detail{
    margin-top:8px; font-size:11.5px; color:var(--text-secondary);
    font-family:ui-monospace,Consolas,'D2Coding',monospace;
    background:rgba(255,255,255,0.75); border:1px solid var(--border); border-radius:6px;
    padding:6px 8px; word-break:break-all;
  }
  #alertBanner .ab-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}

  /* 기본 비밀번호 사용 중 알림 */
  #pwNotice{
    background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:12px; font-size:13px; color:#6b4e00;
  }

  /* 수정 이력 */
  table.hist{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.hist th{text-align:left; background:#eef0f1; padding:6px 8px; border:1px solid var(--border); font-weight:700;}
  table.hist td{padding:6px 8px; border:1px solid var(--border); vertical-align:middle;}
  .badge{display:inline-block; font-size:11px; padding:2px 6px; border-radius:10px; border:1px solid var(--border-strong); background:#fafafa;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>접수처 공지</h1>
    <span class="date" id="todayDate"></span>
  </div>
  <div class="subline" id="subline"></div>

  <div id="alertBanner" class="hidden"></div>
  <div id="pwNotice" class="hidden"></div>

  <div class="toolbar">
    <div class="left" id="toolbarLeft"></div>
    <div class="right">
      <span class="save-status" id="saveStatus"></span>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-head">통신사</div>
      <div id="carrierList"></div>
      <div class="sidebar-foot hidden" id="sidebarFoot">
        <button class="small" style="width:100%" onclick="openCarrierModal()">통신사 관리</button>
      </div>
    </div>

    <div class="main">
      <div class="content-row">
        <table class="notice" id="noticeTable"></table>
        <div id="noteBox"></div>
      </div>
      <div class="legend hidden" id="legend">
        <span>⬤ 강조 (노란 배경)</span>
        <span>⬤ 주의 (빨간 텍스트)</span>
      </div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
/* =========================================================
   설정 — Supabase
   ---------------------------------------------------------
   아래 두 값은 공개되어도 안전합니다(GitHub에 그대로 올려도 됨).
   쓰기 권한은 키가 아니라 DB의 RLS + 서버 함수가 통제합니다.
     · reception_carriers 테이블은 "읽기만" 허용되어 있고
       INSERT/UPDATE/DELETE 권한 자체가 없습니다.
     · 저장은 비밀번호로 발급받은 토큰을 검증하는
       reception_save_carrier() 함수를 통해서만 가능합니다.
   ========================================================= */
const SUPABASE_URL = 'https://omdyyvqkxxigilxjysbz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g41wwhIMN19UchPheU9Vvg_lAHjnZNf';

const SAVE_DEBOUNCE_MS = 700;
const MAX_RETRY = 3;
const VIEWER_REFRESH_MS = 60000;   // 보기 전용일 때만 자동 새로고침

/* =========================================================
   상태
   ========================================================= */
function row(cells, hl){ return { cells: cells, hl: hl || 'none' }; }

// 서버에서 불러오기 전에는 비어 있다. (예전처럼 "샘플 데이터"를 보여주지 않는다 —
//  불러오기 실패 상태에서 편집하면 실제 공지를 덮어쓸 위험이 있었기 때문)
let state = { carriers: {}, carrierOrder: [], updatedAt: null };
let currentCarrierId = null;
let session = { token: null, role: null, expiresAt: null };
let undoStack = [];
let redoStack = [];
let saveTimer = null;
let viewerTimer = null;
let dragRowIndex = null;
let dragCarrierId = null;

let loadOk = false;                     // 서버에서 현재 공지를 정상적으로 불러왔는가
let dirtyCarriers = new Set();          // 저장해야 할 통신사 id
let deletedCarriers = new Set();        // 삭제해야 할 통신사 id
let typing = false;                     // 셀에 타이핑 중이나 아직 blur(확정) 안 됨
let saving = false;                     // 저장 요청 진행 중 (중복 실행 방지)
let isDefaultPassword = false;
let pendingConflict = null;

try {
  const savedSession = sessionStorage.getItem('jeobsu_session');
  if (savedSession) session = JSON.parse(savedSession);
} catch(e){}

function hasUnsaved(){ return dirtyCarriers.size > 0 || deletedCarriers.size > 0; }

/* =========================================================
   유틸
   ========================================================= */
// 불러오기에 실패했으면(loadOk=false) 어떤 경우에도 편집 UI를 켜지 않는다.
function isEdit(){ return loadOk && (session.role === 'edit' || session.role === 'super'); }
function isSuper(){ return loadOk && session.role === 'super'; }

function relativeTime(iso){
  if(!iso) return '-';
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs/60000);
  if(min < 1) return '방금 전';
  if(min < 60) return min + '분 전';
  const hr = Math.floor(min/60);
  if(hr < 24) return hr + '시간 전';
  const day = Math.floor(hr/24);
  if(day === 1) return '어제';
  return day + '일 전';
}

function dateTimeLabel(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0') + ' ' +
         String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function todayLabel(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0') + ' (' + days[d.getDay()] + ')';
}

function clockLabel(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}

function isWhale(){ return /Whale/i.test(navigator.userAgent); }

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function latestUpdatedAt(){
  let best = null;
  state.carrierOrder.forEach(id=>{
    const c = state.carriers[id];
    if(c && c.updatedAt && (!best || new Date(c.updatedAt) > new Date(best))) best = c.updatedAt;
  });
  return best;
}

function pushUndo(){
  undoStack.push(deepClone(state));
  if(undoStack.length > 50) undoStack.shift();
  redoStack = [];
}

function markAllDirty(){
  state.carrierOrder.forEach(id=>{ if(state.carriers[id]) dirtyCarriers.add(id); });
}

function undo(){
  if(undoStack.length === 0) return;
  redoStack.push(deepClone(state));
  state = undoStack.pop();
  if(!state.carriers[currentCarrierId]) currentCarrierId = state.carrierOrder[0] || null;
  markAllDirty();
  render();
  scheduleSave();
}
function redo(){
  if(redoStack.length === 0) return;
  undoStack.push(deepClone(state));
  state = redoStack.pop();
  if(!state.carriers[currentCarrierId]) currentCarrierId = state.carrierOrder[0] || null;
  markAllDirty();
  render();
  scheduleSave();
}

/* 한 통신사만 바뀌었을 때는 그 통신사만, 순서/목록이 바뀌었을 때는 전체를 저장 대상으로 표시 */
function touch(carrierId){
  if(carrierId && state.carriers[carrierId]){
    state.carriers[carrierId].updatedAt = new Date().toISOString();
    dirtyCarriers.add(carrierId);
  } else {
    markAllDirty();
  }
  state.updatedAt = new Date().toISOString();
  scheduleSave();
}

/* =========================================================
   Supabase 호출 (실패 원인을 코드로 구분해서 돌려준다)
   ========================================================= */
async function rpc(fn, args, opts){
  opts = opts || {};
  let res, text;
  try{
    res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Accept': 'application/json'
      },
      body: JSON.stringify(args || {}),
      keepalive: !!opts.keepalive
    });
  } catch(err){
    return { ok:false, code:'BLOCKED',
      detail:'요청이 브라우저에서 차단되었거나 Supabase 서버에 닿지 못했습니다. (' +
             (err && err.message ? err.message : String(err)) + ')' };
  }
  try{
    text = await res.text();
  } catch(err){
    return { ok:false, code:'READ_FAIL', detail:'응답을 읽지 못했습니다. (' + (err && err.message ? err.message : String(err)) + ')' };
  }
  if(!res.ok){
    return { ok:false, code:'HTTP' + res.status,
      detail:'Supabase가 HTTP ' + res.status + ' ' + (res.statusText||'') + ' 로 응답했습니다. 응답 앞부분: ' +
             text.slice(0,200).replace(/\s+/g,' ') };
  }
  let data;
  try{
    data = JSON.parse(text);
  } catch(err){
    return { ok:false, code:'NOT_JSON',
      detail:'JSON이 아닌 응답이 돌아왔습니다. 응답 앞부분: ' + text.slice(0,150).replace(/\s+/g,' ') };
  }
  return { ok:true, data:data };
}

/* =========================================================
   상태 표시 / 경고 배너
   ========================================================= */
function setSaveStatus(text, kind){
  const el = document.getElementById('saveStatus');
  el.textContent = text;
  el.className = 'save-status' + (kind ? ' ' + kind : '');
}

function bannerEl(){ return document.getElementById('alertBanner'); }

function hideSaveBanner(){
  const el = bannerEl();
  el.classList.add('hidden');
  el.classList.remove('soft');
  el.innerHTML = '';
}

function browserHintHtml(){
  return isWhale()
    ? ' <span style="color:var(--text-secondary)">(지금 웨일 브라우저로 접속 중입니다. 웨일의 광고·트래커 차단 기능이 요청을 막는 경우가 있습니다.)</span>'
    : ' <span style="color:var(--text-secondary)">(브라우저의 광고·트래커 차단 기능이나 확장프로그램이 원인일 수 있습니다.)</span>';
}

function showSaveBanner(code, detail){
  const el = bannerEl();
  const browserIssue = (code === 'BLOCKED' || code === 'NOT_JSON' || code.indexOf('HTTP') === 0);
  el.classList.remove('hidden');
  el.classList.remove('soft');
  el.innerHTML =
    '<div class="ab-title">⚠ 수정 내용이 아직 저장되지 않았습니다</div>' +
    '<div class="ab-body">' +
      '화면에 보이는 수정 내용은 <b>내 브라우저 안에만</b> 있습니다. 지금 창을 닫거나 새로고침하면 그대로 사라집니다.' +
      (browserIssue ? '<br><b>크롬(Chrome)으로 이 페이지를 다시 열어서 수정하면 대부분 해결됩니다.</b>' + browserHintHtml() : '') +
    '</div>' +
    '<div class="ab-detail">오류 코드: ' + escapeHtml(code) + ' — ' + escapeHtml(detail) + '</div>' +
    '<div class="ab-actions">' +
      '<button class="primary" onclick="retrySaveNow()">지금 다시 저장 시도</button>' +
      '<button onclick="hideSaveBanner()">경고 숨기기</button>' +
    '</div>';
}

/* 불러오기 실패 — 편집을 아예 잠근다 */
function onLoadFailure(code, detail){
  loadOk = false;
  setSaveStatus('불러오기 실패 (' + code + ') — 편집 잠김', 'err');
  const el = bannerEl();
  el.classList.remove('hidden');
  el.classList.remove('soft');
  el.innerHTML =
    '<div class="ab-title">⚠ 현재 공지 내용을 불러오지 못했습니다 — 편집이 잠겼습니다</div>' +
    '<div class="ab-body">' +
      '서버에서 공지를 받아오지 못했습니다. 잘못된 내용으로 실제 공지를 덮어쓰지 않도록 편집을 막아두었습니다.' +
      '<br><b>크롬(Chrome)으로 이 페이지를 다시 열어주세요.</b>' + browserHintHtml() +
    '</div>' +
    '<div class="ab-detail">오류 코드: ' + escapeHtml(code) + ' — ' + escapeHtml(detail) + '</div>' +
    '<div class="ab-actions">' +
      '<button class="primary" onclick="location.reload()">새로고침해서 다시 시도</button>' +
    '</div>';
  render();
}

/* 동시 수정 충돌 */
function showConflictBanner(carrierId, serverCarrier){
  const mine = state.carriers[carrierId] || {};
  const myRows = (mine.rows || []).length;
  const svRows = (serverCarrier.rows || []).length;
  pendingConflict = { carrierId: carrierId, serverVersion: serverCarrier.version };
  const el = bannerEl();
  el.classList.remove('hidden');
  el.classList.add('soft');
  el.innerHTML =
    '<div class="ab-title">⚠ 동시 수정 충돌 — ' + escapeHtml(mine.name || carrierId) + '</div>' +
    '<div class="ab-body">' +
      '내가 이 화면을 열어둔 사이에 <b>다른 담당자가 같은 통신사를 먼저 수정</b>했습니다. ' +
      '그대로 저장하면 그 수정이 사라집니다.<br>' +
      '내 화면: ' + myRows + '행 · 서버: ' + svRows + '행 (' + escapeHtml(serverCarrier.name || '') + ')' +
    '</div>' +
    '<div class="ab-actions">' +
      '<button class="primary" onclick="conflictTakeServer()">서버 내용 불러오기 (내 수정 취소)</button>' +
      '<button onclick="conflictOverwrite()">내 수정으로 덮어쓰기</button>' +
    '</div>';
  setSaveStatus('동시 수정 충돌 — 위에서 선택해주세요', 'err');
}

function conflictTakeServer(){
  if(!confirm('내가 방금 수정한 내용을 버리고 서버 내용을 다시 불러옵니다. 계속할까요?')) return;
  dirtyCarriers.clear();
  deletedCarriers.clear();
  pendingConflict = null;
  hideSaveBanner();
  location.reload();
}

function conflictOverwrite(){
  if(!pendingConflict) return;
  if(!confirm('다른 담당자의 수정을 내 내용으로 덮어씁니다. 계속할까요?')) return;
  const c = state.carriers[pendingConflict.carrierId];
  if(c) c.version = pendingConflict.serverVersion;   // 서버 최신 버전 기준으로 다시 저장
  pendingConflict = null;
  hideSaveBanner();
  saveDirty(0);
}

/* =========================================================
   불러오기
   ========================================================= */
function applyLoaded(d){
  const carriers = {};
  const order = [];
  (d.carriers || []).forEach(function(c){
    carriers[c.id] = {
      name: c.name,
      columns: c.columns || [],
      rows: c.rows || [],
      note: c.note || { type:'none', title:'', body:'' },
      updatedAt: c.updatedAt,
      updatedBy: c.updatedBy,
      version: c.version
    };
    order.push(c.id);
  });
  state = { carriers: carriers, carrierOrder: order, updatedAt: null };
  state.updatedAt = latestUpdatedAt();
  if(!state.carriers[currentCarrierId]) currentCarrierId = order[0] || null;
}

async function loadFromDb(){
  const r = await rpc('reception_load', {});
  if(!r.ok) return onLoadFailure(r.code, r.detail);
  const d = r.data;
  if(!d || d.ok !== true){
    return onLoadFailure('SERVER', (d && d.error) || '서버가 올바른 응답을 주지 않았습니다.');
  }
  if(!d.carriers || d.carriers.length === 0){
    return onLoadFailure('EMPTY', '서버에 등록된 통신사 공지가 없습니다. 관리자에게 문의해주세요.');
  }
  applyLoaded(d);
  loadOk = true;
  hideSaveBanner();
  setSaveStatus('불러오기 완료 · ' + clockLabel(), 'ok');
  render();
  startViewerRefresh();
}

/* 보기 전용일 때만 주기적으로 최신 공지를 받아온다.
   편집 중인 사람의 화면은 절대 자동으로 바꾸지 않는다. */
function startViewerRefresh(){
  clearInterval(viewerTimer);
  viewerTimer = setInterval(async function(){
    if(isEdit() || hasUnsaved() || typing) return;
    if(document.visibilityState !== 'visible') return;
    const r = await rpc('reception_load', {});
    if(!r.ok || !r.data || r.data.ok !== true) return;
    applyLoaded(r.data);
    render();
  }, VIEWER_REFRESH_MS);
}

/* =========================================================
   저장 (통신사 단위 · 버전 충돌 감지 · 자동 재시도)
   ========================================================= */
function scheduleSave(){
  renderHeader();
  renderSidebar();
  if(!loadOk) return;              // 불러오기 실패 상태에서는 절대 저장하지 않는다
  setSaveStatus('저장 중…', 'warn');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ saveDirty(0); }, SAVE_DEBOUNCE_MS);
}

function retrySaveNow(){
  clearTimeout(saveTimer);
  saveDirty(0);
}

function onSaveFailure(retry, code, detail, noRetry){
  saving = false;
  if(!noRetry && retry < MAX_RETRY){
    const delays = [800, 2000, 5000];
    const wait = delays[retry] || 5000;
    setSaveStatus('저장 실패(' + code + ') · ' + Math.round(wait/1000) + '초 후 자동 재시도 ' + (retry+1) + '/' + MAX_RETRY, 'err');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveDirty(retry + 1); }, wait);
    return;
  }
  setSaveStatus('저장 실패 (' + code + ') — 위 경고 확인', 'err');
  showSaveBanner(code, detail);
}

function handleNeedsAuth(){
  saving = false;
  session = { token:null, role:null, expiresAt:null };
  sessionStorage.removeItem('jeobsu_session');
  setSaveStatus('세션 만료 — 다시 로그인하면 자동으로 저장됩니다.', 'err');
  showSaveBanner('SESSION_EXPIRED',
    '로그인 세션이 만료되어 저장이 거부되었습니다. 다시 로그인하면 방금 수정 내용이 자동으로 저장됩니다.');
  renderToolbar(); renderSidebar(); renderTable();
  if(!window.__authPromptOpen){
    window.__authPromptOpen = true;
    openAuthModal(function(){ window.__authPromptOpen = false; saveDirty(0); }, false);
  }
}

function carrierPayload(id){
  const c = state.carriers[id];
  return {
    id: id,
    name: c.name,
    pos: state.carrierOrder.indexOf(id) + 1,
    columns: c.columns,
    rows: c.rows,
    note: c.note
  };
}

async function saveDirty(retry){
  retry = retry || 0;
  if(!loadOk) return;
  if(saving) return;
  if(!hasUnsaved()){
    setSaveStatus('저장됨 · ' + clockLabel(), 'ok');
    return;
  }
  if(!session.token){ return handleNeedsAuth(); }

  saving = true;
  setSaveStatus(retry ? ('저장 재시도 중… (' + retry + '/' + MAX_RETRY + ')') : '저장 중…', 'warn');

  // 1) 삭제 먼저
  for(const id of Array.from(deletedCarriers)){
    const r = await rpc('reception_delete_carrier', { p_token: session.token, p_id: id });
    if(!r.ok) return onSaveFailure(retry, r.code, r.detail);
    const d = r.data || {};
    if(d.ok){ deletedCarriers.delete(id); continue; }
    if(d.code === 'NEEDS_AUTH') return handleNeedsAuth();
    return onSaveFailure(retry, d.code || 'SERVER', d.error || '알 수 없는 서버 오류', true);
  }

  // 2) 수정 / 추가 (통신사별로 따로 저장 → 다른 통신사를 고친 사람과 충돌하지 않는다)
  for(const id of Array.from(dirtyCarriers)){
    const c = state.carriers[id];
    if(!c){ dirtyCarriers.delete(id); continue; }
    const r = await rpc('reception_save_carrier', {
      p_token: session.token,
      p_carrier: carrierPayload(id),
      p_base_version: (typeof c.version === 'number' ? c.version : null)
    });
    if(!r.ok) return onSaveFailure(retry, r.code, r.detail);
    const d = r.data || {};
    if(d.ok){
      c.version = d.version;
      c.updatedAt = d.updatedAt;
      dirtyCarriers.delete(id);
      continue;
    }
    if(d.code === 'NEEDS_AUTH') return handleNeedsAuth();
    if(d.code === 'CONFLICT'){ saving = false; return showConflictBanner(id, d.server || {}); }
    return onSaveFailure(retry, d.code || 'SERVER', d.error || '알 수 없는 서버 오류', true);
  }

  saving = false;
  state.updatedAt = latestUpdatedAt();
  hideSaveBanner();
  setSaveStatus('저장됨 · ' + clockLabel(), 'ok');
  renderHeader();
  renderSidebar();
}

/* =========================================================
   인증
   ========================================================= */
function openAuthModal(onSuccess, requireSuper){
  const root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal">' +
        '<h2>' + (requireSuper ? '관리자 인증' : '정책 담당자 인증') + '</h2>' +
        '<div class="modal-row"><label>비밀번호</label><input type="password" id="authPw"></div>' +
        '<div class="modal-actions">' +
          '<button onclick="closeModal()">취소</button>' +
          '<button class="primary" onclick="submitAuth(' + (requireSuper ? 'true' : 'false') + ')">확인</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  setTimeout(function(){
    const el = document.getElementById('authPw');
    if(el){ el.focus(); el.onkeydown = function(e){ if(e.key === 'Enter') submitAuth(requireSuper); }; }
  }, 0);
  window.__authSuccess = onSuccess;
}

async function submitAuth(requireSuper){
  const input = document.getElementById('authPw');
  if(!input) return;
  const pw = input.value;
  const r = await rpc('reception_login', { p_password: pw });
  if(!r.ok){
    alert('로그인 요청이 실패했습니다.\n\n오류 코드: ' + r.code + '\n' + r.detail +
          (r.code === 'BLOCKED' ? '\n\n크롬(Chrome)으로 다시 열어보세요.' : ''));
    return;
  }
  const d = r.data || {};
  if(!d.ok){ alert(d.error || '비밀번호가 올바르지 않습니다.'); return; }
  if(requireSuper && d.role !== 'super'){ alert('관리자 권한이 필요합니다.'); return; }

  session = { token: d.token, role: d.role, expiresAt: d.expiresAt };
  isDefaultPassword = !!d.isDefaultPassword;
  try{ sessionStorage.setItem('jeobsu_session', JSON.stringify(session)); } catch(e){}
  closeModal();
  if(window.__authSuccess) window.__authSuccess();
  render();
}

async function logout(){
  if(hasUnsaved() && !confirm('저장되지 않은 수정이 있습니다. 그래도 수정을 종료할까요?')) return;
  const tok = session.token;
  session = { token:null, role:null, expiresAt:null };
  isDefaultPassword = false;
  sessionStorage.removeItem('jeobsu_session');
  dirtyCarriers.clear();
  deletedCarriers.clear();
  hideSaveBanner();
  render();
  if(tok) rpc('reception_logout', { p_token: tok });
}

function closeModal(){ window.__authPromptOpen = false; document.getElementById('modalRoot').innerHTML = ''; }

/* =========================================================
   렌더링
   ========================================================= */
function render(){
  renderHeader();
  renderToolbar();
  renderSidebar();
  renderTable();
  renderPwNotice();
}

function renderHeader(){
  document.getElementById('todayDate').textContent = todayLabel();
  const c = state.carriers[currentCarrierId];
  document.getElementById('subline').innerHTML =
    '전체 최종 갱신 <b>' + relativeTime(state.updatedAt) + '</b>' +
    (c ? ' · 지금 보는 중: <b>' + escapeHtml(c.name) + '</b> (' + relativeTime(c.updatedAt) + ' 수정)' : '') +
    (hasUnsaved() ? ' · <b style="color:var(--danger-text)">저장 안 된 수정 ' + (dirtyCarriers.size + deletedCarriers.size) + '건</b>' : '');
}

function renderPwNotice(){
  const el = document.getElementById('pwNotice');
  if(isSuper() && isDefaultPassword){
    el.classList.remove('hidden');
    el.innerHTML = '🔑 지금 <b>기본 비밀번호</b>로 로그인했습니다. ' +
      '이 상태로 두면 누구나 공지를 고칠 수 있으니 <b>비밀번호 변경</b>에서 바꿔주세요.';
  } else {
    el.classList.add('hidden');
    el.innerHTML = '';
  }
}

function renderToolbar(){
  const left = document.getElementById('toolbarLeft');
  const foot = document.getElementById('sidebarFoot');
  const legend = document.getElementById('legend');
  if(isEdit()){
    foot.classList.remove('hidden');
    legend.classList.remove('hidden');
    left.innerHTML =
      '<button class="small" onclick="undo()" title="실행취소 (Ctrl+Z)">↶ 실행취소</button>' +
      '<button class="small" onclick="redo()" title="다시실행 (Ctrl+Shift+Z)">↷ 다시실행</button>' +
      '<button class="small" onclick="openAddRowModal()">+ 행추가</button>' +
      '<button class="small" onclick="openColumnModal()">+ 열추가</button>' +
      '<button class="small" onclick="openNoteModal()">주의사항 편집</button>' +
      '<button class="small" onclick="openHistoryModal()">수정 이력</button>' +
      (isSuper() ? '<button class="small" onclick="openChangePwModal()">비밀번호 변경</button>' : '') +
      '<button class="small" onclick="logout()">수정 종료</button>';
  } else if(!loadOk){
    foot.classList.add('hidden');
    legend.classList.add('hidden');
    left.innerHTML = '<span class="hint">🔒 현재 공지를 불러오지 못해 편집이 잠겨 있습니다. 위 안내를 확인해주세요.</span>';
  } else {
    foot.classList.add('hidden');
    legend.classList.add('hidden');
    left.innerHTML = '<button class="small primary" onclick="openAuthModal(null, false)">정책 담당자 로그인</button>' +
      '<span class="hint" style="margin-left:6px;">※ 관리자 비밀번호로 입력하면 관리자 권한으로 자동 로그인됩니다</span>';
  }
}

function renderSidebar(){
  const el = document.getElementById('carrierList');
  el.innerHTML = '';
  state.carrierOrder.forEach(function(id){
    const c = state.carriers[id];
    if(!c) return;
    const unsaved = dirtyCarriers.has(id);
    const item = document.createElement('div');
    item.className = 'carrier-item' + (id === currentCarrierId ? ' active' : '');
    item.draggable = isEdit();
    item.dataset.id = id;
    item.innerHTML =
      (isEdit() ? '<span class="grip">⠿</span>' : '') +
      '<div class="info">' +
        '<div class="name">' + escapeHtml(c.name) + '</div>' +
        '<div class="time' + (unsaved ? ' unsaved' : '') + '">' +
          (unsaved ? '● 저장 안 됨' : relativeTime(c.updatedAt) + ' 수정') +
        '</div>' +
      '</div>';
    item.onclick = function(e){
      if(e.target.classList.contains('grip')) return;
      currentCarrierId = id;
      render();
    };
    if(isEdit()){
      item.ondragstart = function(){ dragCarrierId = id; };
      item.ondragover = function(e){ e.preventDefault(); item.classList.add('drag-over'); };
      item.ondragleave = function(){ item.classList.remove('drag-over'); };
      item.ondrop = function(e){
        e.preventDefault(); item.classList.remove('drag-over');
        if(!dragCarrierId || dragCarrierId === id) return;
        pushUndo();
        const order = state.carrierOrder;
        const from = order.indexOf(dragCarrierId);
        const to = order.indexOf(id);
        order.splice(from,1);
        order.splice(to,0,dragCarrierId);
        touch();
        render();
      };
    }
    el.appendChild(item);
  });
}

function renderTable(){
  const carrier = state.carriers[currentCarrierId];
  const table = document.getElementById('noticeTable');
  const noteBox = document.getElementById('noteBox');
  if(!carrier){ table.innerHTML=''; noteBox.innerHTML=''; return; }

  const grouped = carrier.columns.length >= 3;
  const n = carrier.columns.length;
  let colWidths;
  if(n === 1) colWidths = ['100%'];
  else if(n === 2) colWidths = ['32%','68%'];
  else if(n === 3) colWidths = ['18%','42%','40%'];
  else colWidths = carrier.columns.map(function(){ return (100/n).toFixed(1)+'%'; });

  let html = '<colgroup>';
  colWidths.forEach(function(w){ html += '<col style="width:' + w + '">'; });
  if(isEdit()) html += '<col style="width:168px">';
  html += '</colgroup>';

  html += '<tr>';
  carrier.columns.forEach(function(col, colIdx){
    html += '<th ' + (isEdit() ? 'contenteditable="true" onblur="onHeaderEdit(' + colIdx + ', this)"' : '') + '>' + escapeHtml(col) + '</th>';
  });
  if(isEdit()) html += '<th class="col-actions">관리</th>';
  html += '</tr>';

  // rowspan 계산 (첫 컬럼 기준, 연속된 동일값 그룹)
  let spanInfo = [];
  if(grouped){
    let i = 0;
    while(i < carrier.rows.length){
      let j = i;
      while(j+1 < carrier.rows.length && carrier.rows[j+1].cells[0] === carrier.rows[i].cells[0]) j++;
      spanInfo[i] = { span: j-i+1, start: true };
      for(let k=i+1;k<=j;k++) spanInfo[k] = { span:0, start:false };
      i = j+1;
    }
  }

  carrier.rows.forEach(function(r, idx){
    html += '<tr class="' + (r.hl==='warn'?'hl-warn':r.hl==='danger'?'hl-danger':'') + '" data-idx="' + idx + '">';
    r.cells.forEach(function(cellVal, colIdx){
      if(grouped && colIdx===0){
        if(!spanInfo[idx] || !spanInfo[idx].start) return;
        html += '<td rowspan="' + spanInfo[idx].span + '" ' +
                (isEdit() ? 'contenteditable="true" onblur="onGroupCellEdit(' + idx + ', this)"' : '') + '>' +
                escapeHtml(cellVal).replace(/\n/g,'<br>') + '</td>';
      } else {
        html += '<td ' + (isEdit() ? 'contenteditable="true" onblur="onCellEdit(' + idx + ', ' + colIdx + ', this)"' : '') + '>' +
                escapeHtml(cellVal).replace(/\n/g,'<br>') + '</td>';
      }
    });
    if(isEdit()){
      html += '<td class="col-actions"><div class="row-actions">' +
        '<span class="grip-handle" draggable="true" data-row="' + idx + '" title="드래그해서 순서 변경">⠿</span>' +
        '<button title="강조 순환: 없음 → 강조(노란배경) → 주의(빨간글씨)" onclick="cycleHighlight(' + idx + ')">' +
          (r.hl==='none'?'○':r.hl==='warn'?'🟡':'🔴') + '</button>' +
        '<button title="행 복제" onclick="duplicateRow(' + idx + ')">복제</button>' +
        '<button title="행 삭제" onclick="deleteRow(' + idx + ')">✕</button>' +
      '</div></td>';
    }
    html += '</tr>';
  });

  table.innerHTML = html;

  if(isEdit()){
    table.querySelectorAll('tr[data-idx]').forEach(function(tr){
      const grip = tr.querySelector('.grip-handle');
      if(!grip) return;
      grip.ondragstart = function(){ dragRowIndex = parseInt(grip.dataset.row); };
      tr.ondragover = function(e){ e.preventDefault(); };
      tr.ondrop = function(e){
        e.preventDefault();
        const toIdx = parseInt(tr.dataset.idx);
        if(dragRowIndex === null || dragRowIndex === toIdx) return;
        pushUndo();
        const rows = carrier.rows;
        const moved = rows.splice(dragRowIndex,1)[0];
        rows.splice(toIdx,0,moved);
        touch(currentCarrierId);
        renderTable();
      };
    });
  }

  // 공지 영역 (표 아래, 전체 너비. 빈 줄로 문단 구분)
  if(carrier.note && carrier.note.type !== 'none' && carrier.note.body){
    const paragraphs = carrier.note.body.split(/\n\s*\n/).map(function(p){
      return '<p>' + escapeHtml(p).replace(/\n/g,'<br>') + '</p>';
    }).join('');
    const icon = carrier.note.type === 'danger' ? '⚠ ' : '';
    noteBox.innerHTML =
      '<div class="note-box ' + carrier.note.type + '">' +
        '<div class="note-title">' + icon + escapeHtml(carrier.note.title || '주의사항') + '</div>' +
        '<div class="note-body">' + paragraphs + '</div>' +
      '</div>';
  } else {
    noteBox.innerHTML = '';
  }
}

/* =========================================================
   편집 동작
   ========================================================= */
function onCellEdit(rowIdx, colIdx, el){
  typing = false;
  const carrier = state.carriers[currentCarrierId];
  const newVal = el.innerText.replace(/\n+$/,'');
  if(carrier.rows[rowIdx].cells[colIdx] === newVal) return;
  pushUndo();
  carrier.rows[rowIdx].cells[colIdx] = newVal;
  touch(currentCarrierId);
}

function onHeaderEdit(colIdx, el){
  typing = false;
  const carrier = state.carriers[currentCarrierId];
  const newVal = el.innerText.replace(/\n+$/,'');
  if(carrier.columns[colIdx] === newVal) return;
  pushUndo();
  carrier.columns[colIdx] = newVal;
  touch(currentCarrierId);
}

function onGroupCellEdit(rowIdx, el){
  typing = false;
  const carrier = state.carriers[currentCarrierId];
  const newVal = el.innerText.replace(/\n+$/,'');
  const oldVal = carrier.rows[rowIdx].cells[0];
  if(oldVal === newVal) return;
  pushUndo();
  let j = rowIdx;
  while(j < carrier.rows.length && carrier.rows[j].cells[0] === oldVal){
    carrier.rows[j].cells[0] = newVal;
    j++;
  }
  touch(currentCarrierId);
  renderTable();
}

function cycleHighlight(rowIdx){
  pushUndo();
  const carrier = state.carriers[currentCarrierId];
  const order = ['none','warn','danger'];
  const cur = order.indexOf(carrier.rows[rowIdx].hl);
  carrier.rows[rowIdx].hl = order[(cur+1)%order.length];
  touch(currentCarrierId);
  renderTable();
}

function duplicateRow(rowIdx){
  pushUndo();
  const carrier = state.carriers[currentCarrierId];
  carrier.rows.splice(rowIdx+1, 0, deepClone(carrier.rows[rowIdx]));
  touch(currentCarrierId);
  renderTable();
}

function deleteRow(rowIdx){
  if(!confirm('이 행을 삭제할까요?')) return;
  pushUndo();
  state.carriers[currentCarrierId].rows.splice(rowIdx,1);
  touch(currentCarrierId);
  renderTable();
}

/* =========================================================
   모달: 행 추가
   ========================================================= */
function openAddRowModal(){
  const carrier = state.carriers[currentCarrierId];
  const fieldsHtml = carrier.columns.map(function(col,i){
    return '<div class="modal-row"><label>' + escapeHtml(col) + '</label><input type="text" id="addField' + i + '"></div>';
  }).join('');
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal">' +
        '<h2>행 추가 — ' + escapeHtml(carrier.name) + '</h2>' + fieldsHtml +
        '<div class="modal-row"><label>강조</label><select id="addHl">' +
          '<option value="none">없음</option>' +
          '<option value="warn">강조 (노란 배경)</option>' +
          '<option value="danger">주의 (빨간 텍스트)</option>' +
        '</select></div>' +
        '<div class="modal-actions">' +
          '<button onclick="closeModal()">취소</button>' +
          '<button class="primary" onclick="submitAddRow()">추가</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function submitAddRow(){
  const carrier = state.carriers[currentCarrierId];
  const cells = carrier.columns.map(function(_,i){ return document.getElementById('addField'+i).value; });
  const hl = document.getElementById('addHl').value;
  pushUndo();
  carrier.rows.push(row(cells, hl));
  touch(currentCarrierId);
  closeModal();
  renderTable();
}

/* =========================================================
   모달: + 열추가
   ========================================================= */
function openColumnModal(){
  // 이전에 모달을 그냥 닫았을 때 남아 있던 임시값을 반드시 버린다 (오염 방지)
  window.__tempColumns = null;
  window.__tempRows = null;
  saveColumnInputsToTemp();
  renderTempColumnModal(state.carriers[currentCarrierId]);
}

function addColumn(){
  saveColumnInputsToTemp();
  window.__tempColumns.push('새 열');
  window.__tempRows.forEach(function(r){ r.cells.push(''); });
  renderTempColumnModal(state.carriers[currentCarrierId]);
}

function removeColumn(i){
  saveColumnInputsToTemp();
  if(window.__tempColumns.length <= 1){ alert('최소 1개의 열이 필요합니다.'); return; }
  window.__tempColumns.splice(i,1);
  window.__tempRows.forEach(function(r){ r.cells.splice(i,1); });
  renderTempColumnModal(state.carriers[currentCarrierId]);
}

function saveColumnInputsToTemp(){
  if(!window.__tempColumns){
    const carrier = state.carriers[currentCarrierId];
    window.__tempColumns = deepClone(carrier.columns);
    window.__tempRows = deepClone(carrier.rows);
  }
  document.querySelectorAll('[data-colidx]').forEach(function(inp){
    window.__tempColumns[parseInt(inp.dataset.colidx)] = inp.value;
  });
}

function renderTempColumnModal(carrier){
  const rowsHtml = window.__tempColumns.map(function(col,i){
    return '<div class="field-list-row">' +
      '<input type="text" value="' + escapeHtml(col) + '" data-colidx="' + i + '">' +
      '<button class="small" onclick="removeColumn(' + i + ')">삭제</button></div>';
  }).join('');
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) cancelColumnEdit()">' +
      '<div class="modal">' +
        '<h2>+ 열추가 — ' + escapeHtml(carrier.name) + '</h2>' +
        '<div class="hint">열이 3개 이상이면 첫 번째 열 기준으로 자동 그룹핑됩니다. 값 입력은 저장 후 표에서 셀을 클릭해서 하면 됩니다.</div>' +
        '<div style="margin-top:10px;">' + rowsHtml + '</div>' +
        '<button class="small" onclick="addColumn()">+ 열 추가</button>' +
        '<div class="modal-actions">' +
          '<button onclick="cancelColumnEdit()">취소</button>' +
          '<button class="primary" onclick="submitColumnEdit()">저장</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function cancelColumnEdit(){
  window.__tempColumns = null;
  window.__tempRows = null;
  closeModal();
}

function submitColumnEdit(){
  saveColumnInputsToTemp();
  const carrier = state.carriers[currentCarrierId];
  pushUndo();
  carrier.columns = window.__tempColumns;
  carrier.rows = window.__tempRows;
  window.__tempColumns = null;
  window.__tempRows = null;
  touch(currentCarrierId);
  closeModal();
  renderTable();
}

/* =========================================================
   모달: 주의사항 편집
   ========================================================= */
function openNoteModal(){
  const carrier = state.carriers[currentCarrierId];
  const n = carrier.note || {type:'none',title:'',body:''};
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal">' +
        '<h2>주의사항 편집 — ' + escapeHtml(carrier.name) + '</h2>' +
        '<div class="modal-row"><label>유형</label><select id="noteType">' +
          '<option value="none" ' + (n.type==='none'?'selected':'') + '>없음</option>' +
          '<option value="warn" ' + (n.type==='warn'?'selected':'') + '>주의 (노란 배경)</option>' +
          '<option value="danger" ' + (n.type==='danger'?'selected':'') + '>위험 (빨간 배경)</option>' +
        '</select></div>' +
        '<div class="modal-row"><label>제목</label><input type="text" id="noteTitle" value="' + escapeHtml(n.title) + '"></div>' +
        '<div class="modal-row"><label>내용 (빈 줄로 문단 구분)</label>' +
        '<textarea id="noteBody" rows="10">' + escapeHtml(n.body) + '</textarea></div>' +
        '<div class="modal-actions">' +
          '<button onclick="closeModal()">취소</button>' +
          '<button class="primary" onclick="submitNoteEdit()">저장</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function submitNoteEdit(){
  const carrier = state.carriers[currentCarrierId];
  pushUndo();
  carrier.note = {
    type: document.getElementById('noteType').value,
    title: document.getElementById('noteTitle').value,
    body: document.getElementById('noteBody').value
  };
  touch(currentCarrierId);
  closeModal();
  renderTable();
}

/* =========================================================
   모달: 통신사 관리
   ========================================================= */
function openCarrierModal(){
  const rowsHtml = state.carrierOrder.map(function(id){
    const c = state.carriers[id];
    return '<div class="field-list-row">' +
      '<input type="text" value="' + escapeHtml(c.name) + '" data-carrierid="' + escapeHtml(id) + '">' +
      '<button class="small" onclick="removeCarrier(\'' + escapeHtml(id) + '\')">삭제</button></div>';
  }).join('');
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal">' +
        '<h2>통신사 관리</h2>' +
        '<div class="hint">순서 변경은 사이드바에서 드래그로 가능합니다.</div>' +
        '<div style="margin-top:10px;">' + rowsHtml + '</div>' +
        '<button class="small" onclick="addCarrier()">+ 통신사 추가</button>' +
        '<div class="modal-actions">' +
          '<button onclick="closeModal()">취소</button>' +
          '<button class="primary" onclick="submitCarrierEdit()">저장</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function addCarrier(){
  pushUndo();
  const id = 'carrier_' + Date.now();
  state.carriers[id] = {
    name:'새 통신사', columns:['유형','상부점'], rows:[],
    note:{type:'none',title:'',body:''},
    updatedAt: new Date().toISOString(), version: null
  };
  state.carrierOrder.push(id);
  touch(id);
  openCarrierModal();
}

function removeCarrier(id){
  if(state.carrierOrder.length <= 1){ alert('최소 1개의 통신사가 필요합니다.'); return; }
  if(!confirm('이 통신사와 데이터를 모두 삭제할까요?\n(수정 이력에는 남아서 되돌릴 수 있습니다)')) return;
  pushUndo();
  delete state.carriers[id];
  state.carrierOrder = state.carrierOrder.filter(function(x){ return x !== id; });
  dirtyCarriers.delete(id);
  deletedCarriers.add(id);
  if(currentCarrierId === id) currentCarrierId = state.carrierOrder[0] || null;
  touch();
  openCarrierModal();
}

function submitCarrierEdit(){
  pushUndo();
  document.querySelectorAll('[data-carrierid]').forEach(function(inp){
    const id = inp.dataset.carrierid;
    if(state.carriers[id] && state.carriers[id].name !== inp.value){
      state.carriers[id].name = inp.value;
      dirtyCarriers.add(id);
    }
  });
  touch();
  closeModal();
  render();
}

/* =========================================================
   모달: 비밀번호 변경 (관리자 전용)
   ========================================================= */
function openChangePwModal(){
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal">' +
        '<h2>비밀번호 변경</h2>' +
        '<div class="modal-row"><label>대상</label><select id="pwRole">' +
          '<option value="edit">정책 담당자 비밀번호</option>' +
          '<option value="super">관리자 비밀번호</option>' +
        '</select></div>' +
        '<div class="modal-row"><label>새 비밀번호 (4자 이상)</label><input type="password" id="newPw"></div>' +
        '<div class="modal-actions">' +
          '<button onclick="closeModal()">취소</button>' +
          '<button class="primary" onclick="submitChangePw()">변경</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

async function submitChangePw(){
  const role = document.getElementById('pwRole').value;
  const newPw = document.getElementById('newPw').value;
  if(!newPw){ alert('새 비밀번호를 입력해주세요.'); return; }
  const r = await rpc('reception_change_password', { p_token: session.token, p_role: role, p_new: newPw });
  if(!r.ok){ alert('요청 실패 (' + r.code + ')\n' + r.detail); return; }
  const d = r.data || {};
  if(!d.ok){ alert(d.error || '변경에 실패했습니다.'); return; }
  alert('비밀번호가 변경되었습니다.');
  if(role === 'super') isDefaultPassword = false;
  if(role === 'edit' && session.role === 'edit') isDefaultPassword = false;
  closeModal();
  renderPwNotice();
}

/* =========================================================
   모달: 수정 이력 / 되돌리기
   ========================================================= */
async function openHistoryModal(){
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay"><div class="modal wide"><h2>수정 이력</h2><div>불러오는 중…</div></div></div>';
  const r = await rpc('reception_history_list', { p_limit: 50 });
  if(!r.ok){
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal wide">' +
      '<h2>수정 이력</h2><div class="ab-detail">불러오기 실패 (' + escapeHtml(r.code) + ') ' + escapeHtml(r.detail) + '</div>' +
      '<div class="modal-actions"><button onclick="closeModal()">닫기</button></div></div></div>';
    return;
  }
  const list = Array.isArray(r.data) ? r.data : [];
  const actionLabel = { insert:'추가', update:'수정', delete:'삭제', restore:'되돌림', import:'전체교체' };
  const rowsHtml = list.length === 0
    ? '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">아직 이력이 없습니다.</td></tr>'
    : list.map(function(h){
        return '<tr>' +
          '<td>' + dateTimeLabel(h.changedAt) + '</td>' +
          '<td>' + escapeHtml(h.carrierName || h.carrierId) + '</td>' +
          '<td><span class="badge">' + (actionLabel[h.action] || escapeHtml(h.action)) + '</span></td>' +
          '<td>' + (h.changedBy === 'super' ? '관리자' : h.changedBy === 'edit' ? '담당자' : escapeHtml(h.changedBy||'-')) + '</td>' +
          '<td>' + (h.hasSnapshot
            ? '<button class="small" onclick="doRestore(' + h.id + ')">이 시점으로 되돌리기 (' + h.rowCount + '행)</button>'
            : '<span class="hint">되돌릴 내용 없음</span>') + '</td>' +
        '</tr>';
      }).join('');
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal wide">' +
        '<h2>수정 이력 (최근 50건)</h2>' +
        '<div class="hint">"되돌리기"는 그 이력에 기록된 <b>수정 직전 내용</b>으로 해당 통신사를 복원합니다. 현재 내용도 이력에 남습니다.</div>' +
        '<table class="hist" style="margin-top:10px;">' +
          '<tr><th>시각</th><th>통신사</th><th>동작</th><th>수정자</th><th>되돌리기</th></tr>' +
          rowsHtml +
        '</table>' +
        '<div class="modal-actions"><button onclick="closeModal()">닫기</button></div>' +
      '</div>' +
    '</div>';
}

async function doRestore(historyId){
  if(hasUnsaved()){ alert('먼저 저장되지 않은 수정을 처리해주세요.'); return; }
  if(!confirm('이 시점의 내용으로 되돌릴까요?')) return;
  const r = await rpc('reception_restore', { p_token: session.token, p_history_id: historyId });
  if(!r.ok){ alert('요청 실패 (' + r.code + ')\n' + r.detail); return; }
  const d = r.data || {};
  if(!d.ok){
    if(d.code === 'NEEDS_AUTH'){ closeModal(); return handleNeedsAuth(); }
    alert(d.error || '되돌리기에 실패했습니다.');
    return;
  }
  alert('되돌렸습니다. 최신 내용을 다시 불러옵니다.');
  closeModal();
  await loadFromDb();
}

/* =========================================================
   단축키
   ========================================================= */
document.addEventListener('keydown', function(e){
  if(!isEdit()) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z' && e.shiftKey))){ e.preventDefault(); redo(); }
});

/* =========================================================
   저장 안 된 채로 창을 닫는 사고 방지
   ========================================================= */
document.addEventListener('input', function(e){
  if(e.target && e.target.isContentEditable) typing = true;
});

window.addEventListener('beforeunload', function(e){
  if(hasUnsaved() || typing){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

/* 탭이 숨겨지거나 닫히는 순간:
   - 편집 중이던 셀을 강제로 blur 해서 값을 확정시키고
   - 디바운스를 기다리지 않고 keepalive 요청으로 즉시 전송한다 */
function flushSave(){
  if(!loadOk || !session.token) return;
  const ae = document.activeElement;
  if(ae && ae.isContentEditable) ae.blur();
  if(!hasUnsaved()) return;
  clearTimeout(saveTimer);
  // 통신사별로 독립적이므로 병렬 발사해도 서로 영향이 없다
  Array.from(deletedCarriers).forEach(function(id){
    rpc('reception_delete_carrier', { p_token: session.token, p_id: id }, { keepalive:true });
  });
  Array.from(dirtyCarriers).forEach(function(id){
    const c = state.carriers[id];
    if(!c) return;
    rpc('reception_save_carrier', {
      p_token: session.token,
      p_carrier: carrierPayload(id),
      p_base_version: (typeof c.version === 'number' ? c.version : null)
    }, { keepalive:true });
  });
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);

/* =========================================================
   초기 실행
   ========================================================= */
loadFromDb();
</script>
